<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind Website</title>
    <link href="./output.css" rel="stylesheet">
</head>

<body>
    <div class="brightness-100 bg-[url('/img/netflix.jpg')] min-h-screen ">
        <header class="text-5xl text-red-500 font-bold pl-50 flex justify-between sm:text-3xl lg:text-4xl ">

            NETFLIX

            <button class=" text-xs bg-red-500 text-white px-6 py-2 rounded-lg mr-30 sm:px-4 sm:py-2 sm:text-base transition duration-200  ">Sign in</button>


        </header>

        <div class="sm:text-5xl lg:text-6xl">
            <p class="text-5xl font-bold text-white flex justify-center mt-50 ">The hits you won’t <br> find anywhere
                else</p>
            <p class=" sm:text-x text-lg  text-white flex justify-center  mt-6">Starts at Rs 250. Cancel anytime.</p>
            <p class="text-base sm:text-lg font-normal pt-2">
            <p class=" flex justify-center  text-white text-base sm:text-lg ">Ready to watch? Enter your email to create or restart
                your membership.</p>


        </div>

        <div class="flex justify-center gap-1 mr-10 sm:flex-row">
            <input type="text" value="Email Address" disabled
                class=" w-100 h-15 rounded-xl  mt-2 border-2 border-solid border-white text-white" />
            <button
                class="sm:w-auto text-xl  text-white rounded-s-7xl bg-gradient-to-b from-red-600 to-blue-600 rounded-lg px-2 h-16 w-40   ">Get
                Started</button>
        </div>



    </div>





</body>

</html>
